<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <title>每日成长 · 学习打卡</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .icon { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
    .tab .icon { width: 24px; height: 24px; }
  </style>
  <meta name="theme-color" content="#0e1116">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

  <!-- 顶部 -->
  <header class="app-header">
    <div class="h-top">
      <div>
        <div class="h-title">每日<span>成长</span></div>
        <div class="h-date" id="curDate">—</div>
      </div>
      <div class="h-actions">
        <button class="h-dy" id="dyBtn" data-act="openHot">
          <span class="dy-dot" id="dyDot"></span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;margin-right:4px"><path d="M16.5 3c.4 2.3 1.9 4 4.2 4.3v3.1c-1.5.1-2.9-.4-4.2-1.1v5.9c0 4-3.3 7.2-7.4 7.2S1.7 17.2 1.7 13.2 4.9 6 9 6c.4 0 .8 0 1.1.1v3.2c-.4-.1-.7-.2-1.1-.2-2.3 0-4.2 1.9-4.2 4.1s1.9 4.1 4.2 4.1c2.3 0 4.2-1.9 4.2-4.1V3h3.3z"/></svg>
          <span id="dyLabel">热门</span>
        </button>
        <button class="h-import" data-act="openImport"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;margin-right:4px"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>导入</button>
        <button class="h-refresh" data-act="refreshAll" aria-label="刷新今日内容">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div class="progress-text" id="progText"></div>
    </div>
    <div class="quick-tabs">
      <button class="qtab" data-s="english"><svg class="icon" viewBox="0 0 24 24"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg> 英语</button>
      <button class="qtab" data-s="editing"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm3 2v2h2V6H7zm4 0v2h2V6h-2zm4 0v2h2V6h-2zM5 10v8h14v-8H5z"/></svg> 剪辑</button>
      <button class="qtab" data-s="ops"><svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16l4-7 3 5 4-9"/></svg> 运营</button>
      <button class="qtab" data-s="memes"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22c6.075 0 10-4.925 10-11 0-4.5-3-8-6-10 0 3-1 5-3 6 0-3-1-6-4-8 1 4-2 6-2 9 0 0-2-1-3-3 0 5 2 9 8 11z"/></svg> 热梗</button>
    </div>
  </header>

  <main>
    <section class="view" data-s="english" id="view-english"></section>
    <section class="view" data-s="editing" id="view-editing"></section>
    <section class="view" data-s="ops" id="view-ops"></section>
    <section class="view" data-s="memes" id="view-memes"></section>
  </main>

  <nav class="tabbar">
    <button class="tab" data-s="english"><svg class="icon" viewBox="0 0 24 24"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>英语</button>
    <button class="tab" data-s="editing"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm3 2v2h2V6H7zm4 0v2h2V6h-2zm4 0v2h2V6h-2zM5 10v8h14v-8H5z"/></svg>剪辑</button>
    <button class="tab" data-s="ops"><svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16l4-7 3 5 4-9"/></svg>运营</button>
    <button class="tab" data-s="memes"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22c6.075 0 10-4.925 10-11 0-4.5-3-8-6-10 0 3-1 5-3 6 0-3-1-6-4-8 1 4-2 6-2 9 0 0-2-1-3-3 0 5 2 9 8 11z"/></svg>热梗</button>
  </nav>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</body>
</html>
